# ============================================================
# @file        spectark.calidalab.ai.conf
# @description spectark.calidalab.ai nginx server block —
#              Digital Ocean (143.198.83.34) static file serving.
#              Cloudflare proxied (orange) — origin TLS = Let's Encrypt.
#              Fully separate, additive-only vhost (does not touch
#              spectalo / spectaling / SnowChat / SnowClaw / other blocks).
# @author      Kennt Kim
# @company     Calida Lab
# @created     2026-07-05
# @lastUpdated 2026-07-05
#
# Deploy on server:
#   sudo mkdir -p /var/www/spectark
#   # upload the site/ contents to /var/www/spectark (rsync/scp), then:
#   sudo cp spectark.calidalab.ai.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/spectark.calidalab.ai.conf \
#               /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/spectark -d spectark.calidalab.ai
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# HTTP → HTTPS redirect (+ ACME challenge passthrough)
server {
    listen 80;
    listen [::]:80;
    server_name spectark.calidalab.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/spectark;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS static file server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spectark.calidalab.ai;

    # SSL — certbot/Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/spectark.calidalab.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spectark.calidalab.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static file root
    root /var/www/spectark;
    index index.html;

    # Branded 404
    error_page 404 /404.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Caching — images/CSS/fonts 1 year, HTML 5 min
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Main routing
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Security: block dotfiles (the ACME challenge is handled on :80 above)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
